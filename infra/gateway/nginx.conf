# API Gateway Routing (Nginx) — Smart School Hybrid Polyglot Architecture
# Routing:
#   /api/v1/core/*   -> Service A (Node.js / NestJS)
#   /api/v1/engine/* -> Service B (Rust / Axum)
#   /api/v1/ai/*     -> Service C (Python / FastAPI)

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=engine_limit:10m rate=100r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gateway Healthcheck
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"smartschool-nginx"}';
    }

    # Strict rate limit for Auth endpoints (Service A)
    location /api/v1/core/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        set $core_upstream http://host.docker.internal:3001;
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service A — Core ERP & Academic (Node.js / NestJS)
    location /api/v1/core/ {
        limit_req zone=api_limit burst=40 nodelay;
        set $core_upstream http://host.docker.internal:3001;
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Service B — High-Concurrency & Transaction Engine (Rust / Axum + WebSocket CBT)
    location /api/v1/engine/ {
        limit_req zone=engine_limit burst=200 nodelay;
        set $engine_upstream http://host.docker.internal:3002;
        proxy_pass $engine_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Service C — Intelligence, Scheduling & Analytics (Python / FastAPI)
    location /api/v1/ai/ {
        limit_req zone=api_limit burst=20 nodelay;
        set $ai_upstream http://host.docker.internal:8000;
        proxy_pass $ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

