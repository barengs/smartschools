<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 864" width="1120" height="864" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="ssotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1120" height="864" rx="12" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <rect x="24" y="18" width="1072" height="62" rx="10" fill="url(#headerGrad)"/>
  <text x="44" y="45" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.4">INFOGRAFIS ARSITEKTUR EKOSISTEM SMART SCHOOL TERINTEGRASI</text>
  <text x="44" y="66" fill="#bae6fd" font-size="12" font-weight="500">Alur Layanan dari Pengguna &amp; Perangkat Sekolah → Gerbang Keamanan → Tiga Mesin Spesialis → Satu Pusat Data Tunggal</text>

  <!-- Layer Label 1 -->
  <text x="28" y="102" fill="#475569" font-size="11" font-weight="700" letter-spacing="1">1. LAPISAN PENGGUNA &amp; PERANGKAT SEKOLAH (TITIK AKSES)</text>

  <!-- Card 1.1: Web Apps -->
  <rect x="24" y="110" width="342" height="134" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="110" width="342" height="32" rx="10" fill="#e0f2fe"/>
  <rect x="24" y="130" width="342" height="12" fill="#e0f2fe"/>
  <rect x="38" y="118" width="18" height="13" rx="2" fill="none" stroke="#0369a1" stroke-width="1.8"/>
  <line x1="43" y1="134" x2="51" y2="134" stroke="#0369a1" stroke-width="1.8"/>
  <text x="64" y="131" fill="#0c4a6e" font-size="13" font-weight="700">Portal Web Sekolah (Browser)</text>
  <text x="38" y="160" fill="#334155" font-size="11.5" font-weight="600">Untuk: Kepala Sekolah, Guru, TU, &amp; Calon Siswa</text>
  <text x="38" y="180" fill="#475569" font-size="11">• Pendaftaran Online (E-PPDB) &amp; Buku Induk</text>
  <text x="38" y="198" fill="#475569" font-size="11">• SIAKAD, Jadwal Otomatis, &amp; E-Rapor Digital</text>
  <text x="38" y="216" fill="#475569" font-size="11">• Kelas LMS, Ujian CBT Terkunci, &amp; Keuangan</text>
  <text x="38" y="234" fill="#0284c7" font-size="10" font-weight="600">Teknologi: React.js + Vite + TypeScript</text>

  <!-- Card 1.2: Mobile Super-Apps -->
  <rect x="389" y="110" width="342" height="134" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="389" y="110" width="342" height="32" rx="10" fill="#ccfbf1"/>
  <rect x="389" y="130" width="342" height="12" fill="#ccfbf1"/>
  <rect x="405" y="117" width="11" height="17" rx="2" fill="none" stroke="#0f766e" stroke-width="1.8"/>
  <circle cx="410.5" cy="131" r="1" fill="#0f766e"/>
  <text x="426" y="131" fill="#134e4a" font-size="13" font-weight="700">Aplikasi Mobile (Android &amp; iOS)</text>
  <text x="403" y="160" fill="#334155" font-size="11.5" font-weight="600">Untuk: Orang Tua, Siswa, &amp; Guru</text>
  <text x="403" y="180" fill="#475569" font-size="11">• Orang Tua: Notif Hadir, Izin, SPP, Batas Jajan</text>
  <text x="403" y="198" fill="#475569" font-size="11">• Siswa: Kartu QR Dinamis, Jadwal, Tugas, BK</text>
  <text x="403" y="216" fill="#475569" font-size="11">• Guru: Absen GPS + Swafoto &amp; Jurnal &lt; 1 Menit</text>
  <text x="403" y="234" fill="#0d9488" font-size="10" font-weight="600">Teknologi: Flutter (Dart) + Mapbox GPS</text>

  <!-- Card 1.3: IoT & Hardware -->
  <rect x="754" y="110" width="342" height="134" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="754" y="110" width="342" height="32" rx="10" fill="#fef3c7"/>
  <rect x="754" y="130" width="342" height="12" fill="#fef3c7"/>
  <circle cx="773" cy="128" r="2.5" fill="#b45309"/>
  <path d="M768 123 Q773 118 778 123" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <path d="M765 119 Q773 112 781 119" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <text x="790" y="131" fill="#78350f" font-size="13" font-weight="700">Perangkat Fisik &amp; IoT Sekolah</text>
  <text x="768" y="160" fill="#334155" font-size="11.5" font-weight="600">Lokasi: Gerbang, Kantin, Lobi, &amp; Ruang Kelas</text>
  <text x="768" y="180" fill="#475569" font-size="11">• Mesin Tap RFID / Biometrik Gerbang Sekolah</text>
  <text x="768" y="198" fill="#475569" font-size="11">• Mesin Kasir Kantin Non-Tunai (RFID / QRIS)</text>
  <text x="768" y="216" fill="#475569" font-size="11">• Kios Perpus Mandiri, Bel Otomatis, Smartboard</text>
  <text x="768" y="234" fill="#d97706" font-size="10" font-weight="600">Perangkat: ESP32 / Raspberry Pi (Tahan Offline)</text>

  <!-- Arrows Band 1 -> Band 2 -->
  <line x1="195" y1="244" x2="195" y2="282" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="115" y="252" width="160" height="18" rx="9" fill="#e0f2fe"/>
  <text x="195" y="264" text-anchor="middle" fill="#0369a1" font-size="9.5" font-weight="700">Akses Aman HTTPS / WSS</text>

  <line x1="560" y1="244" x2="560" y2="282" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="480" y="252" width="160" height="18" rx="9" fill="#e0f2fe"/>
  <text x="560" y="264" text-anchor="middle" fill="#0369a1" font-size="9.5" font-weight="700">Akses Aplikasi HTTPS</text>

  <line x1="925" y1="244" x2="925" y2="282" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
  <rect x="835" y="252" width="180" height="18" rx="9" fill="#fef3c7"/>
  <text x="925" y="264" text-anchor="middle" fill="#b45309" font-size="9.5" font-weight="700">Sinyal Real-Time MQTT / POS</text>

  <!-- Layer Label 2 -->
  <text x="28" y="298" fill="#475569" font-size="11" font-weight="700" letter-spacing="1">2. PINTU GERBANG KEAMANAN &amp; PENYALUR TRAFIK</text>

  <!-- Card 2.1: API Gateway -->
  <rect x="24" y="306" width="707" height="86" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.8" filter="url(#cardShadow)"/>
  <path d="M48 320 L58 324 L58 334 C58 340 53 344 48 346 C43 344 38 340 38 334 L38 324 Z" fill="#4f46e5"/>
  <text x="68" y="331" fill="#312e81" font-size="13.5" font-weight="700">API Gateway &amp; Pengaman Lalu Lintas (Nginx / Kong)</text>
  <text x="68" y="349" fill="#3730a3" font-size="11">Gerbang tunggal yang mengecek identitas login (SSO), mencegah serangan trafik berlebih, lalu membagi rute:</text>
  <rect x="68" y="360" width="205" height="22" rx="5" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="170" y="375" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="700">/api/v1/core/* → Mesin Admin</text>
  <rect x="283" y="360" width="212" height="22" rx="5" fill="#ffffff" stroke="#fda4af"/>
  <text x="389" y="375" text-anchor="middle" fill="#be123c" font-size="10" font-weight="700">/api/v1/engine/* → Mesin Kilat</text>
  <rect x="505" y="360" width="210" height="22" rx="5" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="610" y="375" text-anchor="middle" fill="#047857" font-size="10" font-weight="700">/api/v1/ai/* → Mesin Pintar AI</text>

  <!-- Card 2.2: EMQX Broker -->
  <rect x="754" y="306" width="342" height="86" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="770" y="331" fill="#78350f" font-size="13.5" font-weight="700">Broker Pesan IoT (EMQX / MQTT)</text>
  <text x="770" y="350" fill="#92400e" font-size="11">Menerima ribuan sinyal tap kartu gerbang di jam</text>
  <text x="770" y="366" fill="#92400e" font-size="11">masuk pagi (06.30–07.00) &amp; menyalurkannya ke</text>
  <text x="770" y="382" fill="#b45309" font-size="11" font-weight="700">Mesin Kecepatan Tinggi tanpa antrean macet.</text>

  <!-- Arrows Band 2 -> Band 3 (ending cleanly above Layer 3 label) -->
  <line x1="170" y1="392" x2="170" y2="424" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrowIndigo)"/>
  <path d="M 389 392 L 389 405 L 495 405 L 495 424" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrowIndigo)"/>
  <path d="M 610 392 L 610 403 L 925 403 L 925 424" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrowIndigo)"/>
  <path d="M 925 392 L 925 411 L 615 411 L 615 424" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrowAmber)"/>

  <!-- Layer Label 3 -->
  <text x="28" y="442" fill="#475569" font-size="11" font-weight="700" letter-spacing="1">3. TIGA MESIN PENGOLAH BACKEND (PEMBAGIAN TUGAS SPESIALIS)</text>

  <!-- Card 3.1: Service A (Node.js) -->
  <rect x="24" y="450" width="342" height="170" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="24" y="450" width="342" height="40" rx="10" fill="#1d4ed8"/>
  <rect x="24" y="476" width="342" height="14" fill="#1d4ed8"/>
  <text x="38" y="469" fill="#ffffff" font-size="13" font-weight="700">Mesin 1: Administrasi &amp; ERP (75%)</text>
  <text x="38" y="484" fill="#dbeafe" font-size="10.5" font-weight="600">Node.js (TypeScript / NestJS)</text>
  <text x="38" y="508" fill="#1e3a8a" font-size="11" font-weight="700">Tugas: Alur administrasi &amp; layanan harian</text>
  <text x="38" y="527" fill="#334155" font-size="11">• Pusat Login Tunggal (SSO JWT RS256)</text>
  <text x="38" y="544" fill="#334155" font-size="11">• E-PPDB, Buku Induk, SIAKAD &amp; E-Rapor TTE</text>
  <text x="38" y="561" fill="#334155" font-size="11">• Materi LMS, Bank Soal, &amp; Tagihan SPP/BOS</text>
  <text x="38" y="578" fill="#334155" font-size="11">• E-BK, E-UKS, Perpustakaan, &amp; Aset Sarpras</text>
  <text x="38" y="595" fill="#334155" font-size="11">• Pengirim Notif ke HP Ortu (FCM, WA, Email)</text>
  <rect x="38" y="602" width="314" height="13" rx="4" fill="#eff6ff"/>
  <text x="195" y="612" text-anchor="middle" fill="#1d4ed8" font-size="9.5" font-weight="700">Pemegang Kunci Utama SSO (Private Key)</text>

  <!-- Card 3.2: Service B (Rust) -->
  <rect x="389" y="450" width="342" height="170" rx="10" fill="#ffffff" stroke="#fda4af" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="389" y="450" width="342" height="40" rx="10" fill="#be123c"/>
  <rect x="389" y="476" width="342" height="14" fill="#be123c"/>
  <text x="403" y="469" fill="#ffffff" font-size="13" font-weight="700">Mesin 2: Kecepatan Tinggi (15%)</text>
  <text x="403" y="484" fill="#ffe4e6" font-size="10.5" font-weight="600">Rust (Axum) — Target Respon &lt; 5 Milidetik</text>
  <text x="403" y="508" fill="#9f1239" font-size="11" font-weight="700">Tugas: Beban serentak ribuan user &amp; uang</text>
  <text x="403" y="527" fill="#334155" font-size="11">• Ujian CBT Aktif (1.000+ siswa anti-down)</text>
  <text x="403" y="544" fill="#334155" font-size="11">• Kunci Exam Browser &amp; Koreksi Skor Otomatis</text>
  <text x="403" y="561" fill="#334155" font-size="11">• Terima Tap Kartu RFID Gerbang (&lt; 3 ms)</text>
  <text x="403" y="578" fill="#334155" font-size="11">• Potong Saldo Kantin (0% Dobel / Minus)</text>
  <text x="403" y="595" fill="#334155" font-size="11">• Sinkronisasi Jadwal Bel Sekolah Otomatis</text>
  <rect x="403" y="602" width="314" height="13" rx="4" fill="#fff1f2"/>
  <text x="560" y="612" text-anchor="middle" fill="#be123c" font-size="9.5" font-weight="700">Ringan (~20 MB), Bisa Jalan di Cloud / Server Lokal</text>

  <!-- Card 3.3: Service C (Python) -->
  <rect x="754" y="450" width="342" height="170" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="754" y="450" width="342" height="40" rx="10" fill="#047857"/>
  <rect x="754" y="476" width="342" height="14" fill="#047857"/>
  <text x="768" y="469" fill="#ffffff" font-size="13" font-weight="700">Mesin 3: Kecerdasan &amp; Jadwal (10%)</text>
  <text x="768" y="484" fill="#d1fae5" font-size="10.5" font-weight="600">Python (FastAPI + Google OR-Tools + ML)</text>
  <text x="768" y="508" fill="#065f46" font-size="11" font-weight="700">Tugas: Hitungan rumit &amp; deteksi dini</text>
  <text x="768" y="527" fill="#334155" font-size="11">• Susun Jadwal Pelajaran Otomatis (0 Bentrok)</text>
  <text x="768" y="544" fill="#334155" font-size="11">• Early Warning System (EWS) tiap jam 08.00</text>
  <text x="768" y="561" fill="#334155" font-size="11">• Deteksi Siswa Sering Alfa / Nilai Menurun</text>
  <text x="768" y="578" fill="#334155" font-size="11">• Hitung Statistik Dashboard Kepala Sekolah</text>
  <text x="768" y="595" fill="#334155" font-size="11">• Rekomendasi Materi Belajar Siswa di LMS</text>
  <rect x="768" y="602" width="314" height="13" rx="4" fill="#ecfdf5"/>
  <text x="925" y="612" text-anchor="middle" fill="#047857" font-size="9.5" font-weight="700">Optimasi Matematis &amp; Analitik Prediktif</text>

  <!-- Internal Communication Bar -->
  <line x1="195" y1="620" x2="195" y2="638" stroke="#475569" stroke-width="1.8"/>
  <line x1="560" y1="620" x2="560" y2="638" stroke="#475569" stroke-width="1.8"/>
  <line x1="925" y1="620" x2="925" y2="638" stroke="#475569" stroke-width="1.8"/>
  <rect x="24" y="636" width="1072" height="36" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="560" y="652" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">JALUR KOMUNIKASI ANTAR-MESIN: Perintah Langsung (gRPC / REST) &amp; Pengiriman Kabar Kilat (Redis Streams)</text>
  <text x="560" y="666" text-anchor="middle" fill="#475569" font-size="10">Contoh: Rust catat siswa tap kartu di gerbang/kantin → kirim kabar ke Redis → Node.js langsung kirim notifikasi ke HP Orang Tua</text>

  <!-- Arrow Bus -> SSOT -->
  <line x1="560" y1="672" x2="560" y2="698" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowSlate)"/>

  <!-- BAND 4: SINGLE SOURCE OF TRUTH -->
  <rect x="24" y="702" width="1072" height="144" rx="12" fill="url(#ssotGrad)" filter="url(#cardShadow)"/>
  <text x="44" y="726" fill="#7dd3fc" font-size="12.5" font-weight="700" letter-spacing="0.6">4. SATU PUSAT DATA TERPADU (SINGLE SOURCE OF TRUTH) — DATA TIDAK PERNAH GANDA</text>

  <!-- Storage Pillar 1: PostgreSQL -->
  <rect x="42" y="738" width="388" height="94" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="56" y="758" fill="#ffffff" font-size="12.5" font-weight="700">Database Utama (PostgreSQL 16+)</text>
  <text x="56" y="775" fill="#cbd5e1" font-size="10.5">Terbagi menjadi 4 ruang logis dengan hak tulis ketat:</text>
  <text x="56" y="792" fill="#93c5fd" font-size="10">• iam_master (Akun, Siswa, Guru, Ortu, Kartu)</text>
  <text x="56" y="807" fill="#93c5fd" font-size="10">• academic_lms (Kelas, Jadwal, Nilai, E-Rapor, BK/UKS)</text>
  <text x="56" y="822" fill="#93c5fd" font-size="10">• high_speed_ops &amp; finance_analytics (Absen, CBT, Dompet, SPP, EWS)</text>

  <!-- Storage Pillar 2: Redis -->
  <rect x="446" y="738" width="316" height="94" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.2"/>
  <text x="460" y="758" fill="#ffffff" font-size="12.5" font-weight="700">Memori Kilat &amp; Antrean (Redis Cluster)</text>
  <text x="460" y="777" fill="#cbd5e1" font-size="10.5">• Menyimpan soal &amp; jawaban ujian CBT sementara</text>
  <text x="460" y="794" fill="#cbd5e1" font-size="10.5">• Penjaga anti-transaksi ganda kasir kantin</text>
  <text x="460" y="811" fill="#cbd5e1" font-size="10.5">• Jembatan pesan antar-mesin &amp; antrean notifikasi</text>

  <!-- Storage Pillar 3: MinIO/S3 -->
  <rect x="778" y="738" width="300" height="94" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
  <text x="792" y="758" fill="#ffffff" font-size="12.5" font-weight="700">Gudang Berkas &amp; Media (MinIO / S3)</text>
  <text x="792" y="777" fill="#cbd5e1" font-size="10.5">• Berkas dokumen pendaftaran E-PPDB</text>
  <text x="792" y="794" fill="#cbd5e1" font-size="10.5">• Video pembelajaran LMS &amp; E-Book Perpus</text>
  <text x="792" y="811" fill="#cbd5e1" font-size="10.5">• PDF E-Rapor TTE &amp; swafoto presensi guru</text>
</svg>
