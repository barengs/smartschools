services:
  postgres:
    image: postgres:16-alpine
    container_name: smartschool_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartschool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartschool_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-smartschool_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartschool} -d ${POSTGRES_DB:-smartschool_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartschool_net

  redis:
    image: redis:7-alpine
    container_name: smartschool_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-smartschool_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-smartschool_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartschool_net

  minio:
    image: minio/minio:latest
    container_name: smartschool_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_pass}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartschool_net

  minio-init:
    image: minio/mc:latest
    container_name: smartschool_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_dev_pass};
      mc mb --ignore-existing local/ppdb-docs;
      mc mb --ignore-existing local/lms-media;
      mc mb --ignore-existing local/erapor-signed;
      mc mb --ignore-existing local/attendance-selfies;
      mc mb --ignore-existing local/library-ebooks;
      exit 0;
      "
    networks:
      - smartschool_net

  emqx:
    image: emqx/emqx:5-alpine
    container_name: smartschool_emqx
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_TLS_PORT:-8883}:8883"
      - "${MQTT_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartschool_net

  gateway:
    image: nginx:1.27-alpine
    container_name: smartschool_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartschool_net

volumes:
  pg_data:
  redis_data:
  minio_data:
  emqx_data:

networks:
  smartschool_net:
    driver: bridge

